<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Option Login</title>
    <style>
        /* استایل‌های ساده و ریسپانسیو */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #fff;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 25px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            margin-bottom: 30px;
            font-weight: 300;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9em;
            opacity: 0.8;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 1em;
            outline: none;
            box-sizing: border-box;
        }
        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #00c6ff;
            background: linear-gradient(to right, #0072ff, #00c6ff);
            color: #fff;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }
        button:hover {
            transform: scale(1.02);
        }
        .message {
            margin-top: 20px;
            font-size: 0.9em;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }
        .message.success { background: rgba(0, 200, 0, 0.3); display: block; }
        .message.error { background: rgba(200, 0, 0, 0.3); display: block; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>ورود به حساب کاربری</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="email">ایمیل</label>
                <input type="email" id="email" name="email" placeholder="example@mail.com" required>
            </div>
            <div class="input-group">
                <label for="password">رمز عبور</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit">ورود و شروع ترید</button>
        </form>
        <div id="message" class="message"></div>
    </div>

    <script>
        // مدیریت ارسال فرم بدون رفرش صفحه
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
            
            messageDiv.className = 'message';
            messageDiv.textContent = 'در حال اتصال به سرور...';

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    messageDiv.className = 'message success';
                    messageDiv.textContent = '✅ ورود موفق! ربات در حال اجراست.';
                } else {
                    messageDiv.className = 'message error';
                    messageDiv.textContent = '❌ ' + (data.error || 'خطا در ورود');
                }
            } catch (error) {
                messageDiv.className = 'message error';
                messageDiv.textContent = '❌ خطا در ارتباط با سرور';
            }
        });
    </script>
</body>
</html>
